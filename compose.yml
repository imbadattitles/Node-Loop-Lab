services:
  node-loop-lab:
    build:
      context: .
      target: runtime
      args:
        SITE_URL: "${SITE_URL:-http://localhost:3000}"
    image: node-loop-lab:local
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      LAB_MODE: public
      PORT: 3000
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: "postgresql://node_loop_lab_app:${POSTGRES_PASSWORD:-node-loop-lab-local}@postgres:5432/node_loop_lab"
      TRUST_PROXY: "${TRUST_PROXY:-}"
      SITE_URL: "${SITE_URL:-http://localhost:3000}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    mem_limit: 2g
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    user: "999:1000"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped
    stop_grace_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /data:size=192m,uid=999,gid=1000,mode=0700
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 2s
      start_period: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  postgres:
    image: postgres:18-alpine
    user: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: node_loop_lab
      POSTGRES_USER: node_loop_lab_admin
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:-node-loop-lab-admin-local}"
      POSTGRES_APP_PASSWORD: "${POSTGRES_PASSWORD:-node-loop-lab-local}"
      PGDATA: /var/lib/postgresql/18/docker
    mem_limit: 768m
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /var/lib/postgresql:size=512m,uid=70,gid=70,mode=0700
    volumes:
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-node-loop-lab-app.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U node_loop_lab_admin -d node_loop_lab
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
